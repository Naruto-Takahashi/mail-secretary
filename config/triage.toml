# AI による判定と、その結果の Gmail への反映 (既定値)。
# 個人の事情に合わせた基準・ラベル名・旧ラベルの対応は、リポジトリの外の上書き設定 (README 参照) に書く。

model = "gemini-3.8-flash-medium"   # `agy models` で確認できる ID
batch_size = 20                     # 1 回の AI 呼び出しに渡すメール数 (本文も渡すので少なめ)
# 認証コード等はモデルに送らない (件名自体にコードが入るため)
sensitive_pattern = "認証キー|認証コード|確認コード|ワンタイム|verification code|one-time|OTP|パスコード|security code"

# 本文の扱い: 先頭の body_chars 字だけを AI に渡す。長い数字 (カード番号等) は伏せる。0 なら本文を渡さない。
body_chars = 800

rubric = """あなたは個人のメール秘書です。各メールについて「重要度」と「種類」を、送信元ではなく中身(件名と本文)で判定してください。

## 重要度 (level)
- urgent (P0): 期限が近い連絡(24〜48時間以内)、決済・セキュリティの異常、人から個人宛で返事待ちのもの
- action (P1): 対応が要るが急ぎではないもの(コードレビューの依頼、提出物・案内、仕事や学業の連絡)
- info (P2): 読めばよいだけの通知(取引の完了・利用のお知らせ・請求の確定・領収書・配送連絡・CI 結果など)
- ignore (P3): 広告・キャンペーン・ポイント企画・新商品や新機能の案内・メルマガ・SNS 通知・自動配信

## 同じ送信元でも、中身で分ける
- カード会社・ECサイト・通信会社などは、取引の通知(利用のお知らせ、請求・支払予定額、領収書、明細の更新、利用規約の改定など)と、広告(ポイント進呈・キャンペーン・新着商品・おすすめ・ギフト企画など)の両方を送ってくる。前者は info 以上、後者は ignore にする。
- サブスクの「トライアル終了の予告」「値上げ」「更新・請求の確定」は action 以上、新機能の紹介やおすすめは ignore にする。

## 種類 (kind)
各メールに、次のうち最も近い 1 つを選ぶ。"""

# 個別ルール (上の基準より優先)。上書き設定で足す。
hints = []

[levels.urgent]
label = "P0"
color = ["#cc3a21", "#ffffff"]   # [背景, 文字]。Gmail が許す色のみ
[levels.action]
label = "P1"
color = ["#ffad47", "#000000"]
[levels.info]
label = "P2"
color = ["#fad165", "#000000"]
[levels.ignore]
label = ""                       # P3: ラベルを付けない (アーカイブのみ)

# 種類の色は全て同じ落ち着いたグレー (色分けするのは重要度だけ)
[kinds.payment]
label = "決済"
color = ["#cccccc", "#000000"]
desc = "実際の取引の通知 (カード利用のお知らせ・請求や支払予定額・領収書・明細・配送など)。広告やポイント企画は含めない"
[kinds.univ]
label = "大学"
color = ["#cccccc", "#000000"]
desc = "大学・学校・研究室の連絡や案内 (学務・授業・研究・キャリア支援室の案内など)"
[kinds.job]
label = "就活"
color = ["#cccccc", "#000000"]
desc = "就職活動・仕事・転職の連絡 (企業・就活サイトからの案内、面接、説明会、インターンなど)"
[kinds.dev]
label = "開発"
color = ["#cccccc", "#000000"]
desc = "コード・GitHub・開発ツール・技術記事・技術コミュニティの通知"
[kinds.promo]
label = "広告"
color = ["#cccccc", "#000000"]
desc = "広告・キャンペーン・ポイント企画・新商品や新機能の案内・メルマガ・買い物のおすすめ"
[kinds.social]
label = "SNS"
color = ["#cccccc", "#000000"]
desc = "SNS・ゲーム・動画・コミュニティの通知"
[kinds.security]
label = "認証"
color = ["#cccccc", "#000000"]
desc = "ログイン・認証・アカウント・パスワード・不正利用などのセキュリティ通知"
[kinds.other]
label = ""
desc = "上のどれにも当てはまらない"

[organize]
# 受信トレイに残す条件: 緊急・要対応は常に残す。参考は、残す種類のうち、新しいものだけ残す。それ以外はアーカイブ。
inbox_keep_kinds = ["payment", "security"]
inbox_keep_days = 30
# 種類ラベルが付いていても、スター付きは常に残す (ラベルでの保護はしない)。

# 旧ラベルの名前の対応 (`mail-secretary labels sync`)。上書き設定で足す。 { 旧名 = "新名" }
[legacy]
rename = {}
# 判定時に、旧種類ラベル (送信元で付いたもの) として外す名前。上書き設定で足す。
old_kind_labels = []

# 既存メールへの一回限りのラベル付け (`mail-secretary backfill`)
[backfill]
stale_days = 30   # これより古い緊急・要対応は、参考に下げる
# AI を呼ばず「無視」「買い物・プロモ」にするもの。Gmail のカテゴリと、個人用のプロモ系ラベル (上書き設定で足す)
rule_ignore_categories = ["CATEGORY_PROMOTIONS", "CATEGORY_SOCIAL"]
rule_ignore_labels = []

# カレンダー予定の色 (Google Calendar colorId)
# - 指定なし (""): カレンダー既定色 (ワイン: LR開発バイト)
# 1: ラベンダー (薄紫: 就活・面接)
# 2: セージ (薄緑: 輪講)
# 3: グレープ (紫: 櫻井研面談・卒論)
# 5: バナナ (黄: 福岡未踏)
# 6: みかん (オレンジ: 重要締切・奨学金手続・重要イベント)
# 7: ピーコック (水色/シアン: オリズン)
# 8: グラファイト (グレー: 家庭教師バイト)
# 9: ブルーベリー (濃青: その他の予定)
# 11: トマト (赤: 個人・プライベート ※被りを避けるため自動登録では使わない)
[calendar.colors]
deadline = "6"        # オレンジ (みかん): 奨学金・各種重要手続きの締切、大きめの重要イベント (最も目立たせる)
sakurai_lab = "3"     # 紫 (グレープ): 櫻井研究室・教授面談・卒論関連
sakurai_rinko = "2"   # 緑 (セージ): 輪講
fukuoka_mitou = "5"   # 黄色 (バナナ): 福岡未踏
orizon = "7"          # 水色/シアン (ピーコック): オリズン
lr_dev = ""           # カレンダー既定色 (ワイン): LR開発バイト
job = "1"             # 薄紫 (ラベンダー): 就活・面接・選考
other = "9"           # 濃青 (ブルーベリー): その他の予定


