# AI による重要度判定と、その結果の Gmail への反映 (既定値)。
# 個人の事情に合わせた基準・保護ラベルは、リポジトリの外の上書き設定 (README 参照) に書く。

model = "gemini-3.8-flash-medium"   # `agy models` で確認できる ID
batch_size = 25                     # 1 回の AI 呼び出しに渡すメール数
# 認証コード等はモデルに送らない (件名自体にコードが入るため)
sensitive_pattern = "認証キー|認証コード|確認コード|ワンタイム|verification code|one-time|OTP|パスコード|security code"

rubric = """あなたは個人のメール秘書です。
各メールの重要度を次の4段階で判定してください。
- urgent: 期限が近い連絡(24〜48時間以内)、決済・セキュリティの異常、人から個人宛で返事待ちのもの
- action: 対応が要るが急ぎではないもの(コードレビューの依頼、提出物・案内、仕事や学業の連絡)
- info: 読めばよいだけの通知(決済完了・配送連絡・CI 結果など)
- ignore: プロモーション・メルマガ・SNS 通知・自動配信"""

# 個別ルール (上の基準より優先)。上書き設定で足す。
hints = []

# 重要度ラベル名。空文字はラベルを付けない。
[labels]
urgent = "重要度/1_緊急"
action = "重要度/2_要対応"
info = "重要度/3_参考"
ignore = ""

[organize]
archive_levels = ["info", "ignore"]   # 受信トレイから外す重要度
# 既存フィルタが「受信トレイに残す」と決めているラベル。AI 判定でも外さない (スター付きは常に保護)。
protected_labels = []

# 既存メールへの一回限りのラベル付け (`mail-secretary backfill`)
[backfill]
stale_days = 30   # これより古い緊急・要対応は、参考に下げる
# AI を呼ばず「無視」にするもの。Gmail のカテゴリと、個人用のプロモ系ラベル (上書き設定で足す)
rule_ignore_categories = ["CATEGORY_PROMOTIONS", "CATEGORY_SOCIAL"]
rule_ignore_labels = []
